# XcodeGen spec for the Atrium Capture iPhone app.
# Regenerate the project after adding files:  cd ios && xcodegen
name: AtriumCapture
options:
  bundleIdPrefix: com.atrium
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  ScanCore:
    path: ScanCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
targets:
  AtriumCapture:
    type: application
    platform: iOS
    sources:
      - path: AtriumCapture
    dependencies:
      - package: ScanCore
        product: AtriumScanCore
    info:
      path: AtriumCapture/Info.plist
      properties:
        CFBundleDisplayName: Atrium Capture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arkit
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Atrium Capture uses the camera and LiDAR scanner to measure rooms, record your walking path and read pairing codes.
        NSLocalNetworkUsageDescription: Atrium Capture sends scans to an Atrium dashboard running on a computer on your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.atrium.capture.pairing
            CFBundleURLSchemes:
              - atriumcapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atrium.capture
        PRODUCT_NAME: AtriumCapture
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  AtriumCapture:
    build:
      targets:
        AtriumCapture: all
    run:
      config: Debug
    archive:
      config: Release
