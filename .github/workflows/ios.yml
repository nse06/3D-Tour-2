# Builds the iPhone capture app against the real iOS SDK on every change under ios/,
# and publishes an unsigned .ipa you can install with Sideloadly or AltStore (they sign
# it with your own Apple ID) — no Mac needed. See ios/README.md.
name: iOS capture app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scancore:
    name: ScanCore tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: ios/ScanCore
        run: swift test

  app:
    name: Build Atrium Capture (unsigned .ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios
      - name: Build (Release, device, unsigned)
        run: |
          set +e
          xcodebuild \
            -project ios/AtriumCapture.xcodeproj \
            -scheme AtriumCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          grep -E -B2 -A6 "(error|warning): " build.log | grep -v "^--$" | head -300
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log
          exit $status
      - name: Package unsigned .ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/AtriumCapture.app dist/Payload/
          cd dist && zip -qry AtriumCapture-unsigned.ipa Payload && ls -la AtriumCapture-unsigned.ipa
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: AtriumCapture-unsigned-ipa
          path: dist/AtriumCapture-unsigned.ipa
          retention-days: 30
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log

  simulator:
    name: Simulator test (pair → demo scan → send; rebuild a multi-room scan)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator (Debug)
        # Debug keeps the automation hooks; optimized Swift keeps photo texturing as fast as on a phone.
        run: |
          set +e
          xcodebuild \
            -project ios/AtriumCapture.xcodeproj \
            -scheme AtriumCapture \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            build > build.log 2>&1
          status=$?
          grep -E -B2 -A6 "error: " build.log | grep -v "^--$" | head -200
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log
          exit $status
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          phones.sort(key=lambda x: x[0], reverse=True)
          pro = [p for p in phones if "Pro" in p[1]["name"]] or phones
          print(pro[0][1]["udid"])
          print(pro[0][1]["name"], pro[0][0], file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Launch
        run: |
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/AtriumCapture.app
          mkdir -p shots
          xcrun simctl launch "$UDID" com.atrium.capture
          sleep 10
          xcrun simctl io "$UDID" screenshot shots/1-home.png
          xcrun simctl terminate "$UDID" com.atrium.capture
      - name: Pair, build the demo scan and send it to a mock Atrium server
        run: |
          python3 ios/ci/mock_atrium_server.py --port 8765 --out results > mock.log 2>&1 &
          sleep 1
          TOKEN=$(python3 -c "print('T' * 43)")
          LINK="atriumcapture://pair?server=http%3A%2F%2F127.0.0.1%3A8765&token=$TOKEN"
          xcrun simctl launch "$UDID" com.atrium.capture -atrium-automation "pair=$LINK|wait=2|demo|wait=3|send|wait=2"
          STATUS="$(xcrun simctl get_app_container "$UDID" com.atrium.capture data)/Documents/automation-status.json"
          seen=""
          stage=none
          for i in $(seq 1 300); do
            stage=$(python3 -c "import json; print(json.load(open('$STATUS'))['stage'])" 2>/dev/null || echo none)
            if [ "$stage" != "$seen" ]; then
              echo "stage: $(cat "$STATUS" 2>/dev/null)"
              seen=$stage
              sleep 1.5
              xcrun simctl io "$UDID" screenshot "shots/2-$stage.png" > /dev/null 2>&1 || true
            fi
            case "$stage" in done|failed) break ;; esac
            sleep 1
          done
          tail -20 mock.log
          test "$stage" = done
          python3 -c "import json; r = json.load(open('results/results.json')); print(r); assert r['ok'] and r['rooms'] == 6 and r['links'] >= 5, r"
      - name: Rebuild multi-room scans (Apple's RoomPlan sample, each room in its own frame)
        run: |
          curl -fsSL --retry 3 -o merging.zip https://docs-assets.developer.apple.com/published/3e2b731b0ef7/MergingMultipleScansIntoASingleStructure.zip
          mkdir -p sample && unzip -q merging.zip -d sample
          xcrun simctl terminate "$UDID" com.atrium.capture || true
          DATA="$(xcrun simctl get_app_container "$UDID" com.atrium.capture data)"
          # One scan with the merged structure a real capture saves, one with only the walked path,
          # and one saved the way build 7 saves a capture, with a LiDAR mesh per room.
          WITH_STRUCTURE=$(python3 ios/ci/make_legacy_scan.py sample "$DATA/Documents/Scans" --with structure)
          WITH_PATH=$(python3 ios/ci/make_legacy_scan.py sample "$DATA/Documents/Scans" --with path)
          WITH_MESH=$(python3 ios/ci/make_legacy_scan.py sample "$DATA/Documents/Scans" --with mesh)
          STATUS="$DATA/Documents/automation-status.json"
          rm -f "$STATUS"
          xcrun simctl launch "$UDID" com.atrium.capture -atrium-automation "rebuild|wait=1"
          stage=none
          for i in $(seq 1 600); do
            stage=$(python3 -c "import json; print(json.load(open('$STATUS'))['stage'])" 2>/dev/null || echo none)
            case "$stage" in done|failed) break ;; esac
            sleep 1
          done
          cat "$STATUS"; echo
          xcrun simctl io "$UDID" screenshot shots/3-rebuilt.png > /dev/null 2>&1 || true
          for ID in "$WITH_STRUCTURE" "$WITH_PATH" "$WITH_MESH"; do
            mkdir -p "results/rebuild/$ID" && cp "$DATA/Documents/Scans/$ID"/{alignment.json,info.json,manifest.json,scan.glb} "results/rebuild/$ID/" 2>/dev/null || true
            cp "$DATA/Documents/Scans/$ID/roomplan/structure.json" "results/rebuild/$ID/" 2>/dev/null || true
          done
          test "$stage" = done
          python3 ios/ci/check_rebuild.py "$DATA/Documents/Scans/$WITH_STRUCTURE" sample --method structure --tolerance 0.05
          python3 ios/ci/check_rebuild.py "$DATA/Documents/Scans/$WITH_PATH" sample --method path --tolerance 0.15 --photos
          python3 ios/ci/check_rebuild.py "$DATA/Documents/Scans/$WITH_MESH" sample --method path --tolerance 0.15 --photos --mesh

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test
          path: |
            shots
            results/results.json
            results/rebuild
            mock.log
            build.log
