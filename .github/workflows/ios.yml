# Compiles the iPhone capture app against the real iOS SDK on every change under ios/.
# Code signing is disabled: this proves the project builds; to install it on a phone,
# open ios/AtriumCapture.xcodeproj in Xcode and run it with your own (free) Apple ID.
name: iOS capture app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scancore:
    name: ScanCore tests (macOS)
    runs-on: macos-latest
    if: hashFiles('ios/ScanCore/Package.swift') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: ios/ScanCore
        run: swift test

  app:
    name: Build AtriumCapture (iOS, unsigned)
    runs-on: macos-latest
    if: hashFiles('ios/AtriumCapture.xcodeproj/project.pbxproj') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios
      - name: Build
        run: |
          set +e
          xcodebuild \
            -project ios/AtriumCapture.xcodeproj \
            -scheme AtriumCapture \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          grep -E -B2 -A6 "error:" build.log | head -400
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log
          exit $status
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
